name: debug
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/debug_gap.mjs']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/debug_gap.mjs 2026-10-12
