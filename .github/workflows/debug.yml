name: debug
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/debug_gap.mjs', '.github/workflows/debug.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: mkdir -p debug && node scripts/debug_gap.mjs 2026-10-12 > debug/gap.json
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug && git commit -m "Probe output" && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
